# Example stack for running the EcoV Charge API and its PostgreSQL database.
# Copy example.env to .env and replace the placeholder API/OAuth values before
# using integrations that depend on them.
services:
  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    environment:
      SERVER_ADDRESS: ":8080"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}"
      ELECTRICITYMAPS_API_URL: "${ELECTRICITYMAPS_API_URL:-https://api.electricitymaps.com/v4}"
      ELECTRICITYMAPS_API_KEY: "${ELECTRICITYMAPS_API_KEY:-YOUR_API_KEY_HERE}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-YOUR_WEB_CLIENT_ID.apps.googleusercontent.com}"
      SESSION_TTL_DAYS: "${SESSION_TTL_DAYS:-30}"
      DATABASE_URL: "postgres://ecov_charge:ecov_charge@postgres:5432/ecov_charge?sslmode=disable"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecov_charge
      POSTGRES_USER: ecov_charge
      POSTGRES_PASSWORD: ecov_charge
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ecov_charge_server_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecov_charge -d ecov_charge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  ecov_charge_server_postgres:
